# Anything that doesn't match our server_name gets dropped.
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # Container healthcheck for nginx itself (Host: 127.0.0.1 lands here).
  location = /nginx-health {
    allow 127.0.0.1;
    deny all;
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 444;
  }
}

server {
  listen 80;
  server_name localhost gsp.local;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name localhost gsp.local;

  # Self-signed for local. In production this is a Cloudflare Origin CA cert
  # with Full (strict) mode and authenticated origin pulls.
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;

  location = /healthz { proxy_pass http://$live_upstream; access_log off; }
  location = /readyz  { proxy_pass http://$live_upstream; access_log off; }

  location /api/ {
    limit_req zone=writes burst=20 nodelay;
    proxy_pass http://$live_upstream;
  }

  location / {
    return 404;
  }
}
