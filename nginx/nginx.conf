load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  log_format main escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"urt":"$upstream_response_time",'
    '"upstream":"$upstream_addr","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # Rate limit writes only. Reads are cheap and a per-IP limit on GET would
  # also throttle anything sitting behind a shared NAT (or Cloudflare, before
  # real_ip is configured).
  map $request_method $write_limit_key {
    default         "";
    POST            $binary_remote_addr;
    PUT             $binary_remote_addr;
    PATCH           $binary_remote_addr;
    DELETE          $binary_remote_addr;
  }
  limit_req_zone $write_limit_key zone=writes:10m rate=10r/s;
  limit_req_status 429;

  # Blue/green switch without reloading nginx (see njs/live.js).
  js_import live from /etc/nginx/njs/live.js;
  js_set $live_upstream live.pick;

  # Fixed IPs (set in docker-compose.yml) rather than container names: names
  # are resolved once at startup, so a recreated container with a new IP
  # would leave nginx pointing at nothing. Fixed IPs also mean nginx starts
  # fine even when one colour isn't running.
  upstream app_blue {
    server 172.30.0.11:3000 max_fails=0;
    keepalive 32;
  }
  upstream app_green {
    server 172.30.0.12:3000 max_fails=0;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
